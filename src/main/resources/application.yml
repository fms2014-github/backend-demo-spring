spring:
  application:
    name: backend

  config:
    import: "classpath:configuration/etc/security-whitelist.yml"

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/fms2014
    username: root
    password: "YlI1SG91SnB3UElCRjlaeG5xcndIQT09"
    hikari:
      maximum-pool-size: 30
      pool-name: "Hikari Connection Pool"  # Pool Name Alias
      minimum-idle: 10
      idle-timeout: 10000
      connection-timeout: 3000
      auto-commit: false
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  thymeleaf:
    prefix: "classpath:/templates/"
    suffix: .html
    view-names: thymeleaf/*
    cache: false
  mvc:
    view:
      prefix: "/WEB-INF/views/"
      suffix: .jsp
  messages:
    encoding: "UTF-8"
  servlet:
    encoding:
      charset: "UTF-8"
      enabled: true
      force: true

logging:
  config: "classpath:configuration/log4j/log4j2.yaml"

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: "com.portfolio.backend.dto"
  mapper-locations: "classpath*:mapper/*.xml"

management:
  endpoints:
    web:
      exposure:
        include: "env,health" # env 엔드포인트를 웹으로 노출

springdoc:
  api-docs:
    enabled: true
    path: "/spring-boot/study"
  swagger-ui:
    path: "/swagger-ui.html"
    enabled: true

jwt:
  secret: "v3rys3cr3tk3y_must_be_long_enough_for_security_standard_at_least_256_bits"
  expiration: 3600000 # 1일