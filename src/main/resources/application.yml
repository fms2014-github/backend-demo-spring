server:
  port: 8080

spring:
  devtools:
    restart:
      additional-exclude: "**/META-INF/**"
  application:
    name: backend

  config:
    import: "classpath:configuration/etc/security-whitelist.yml"

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/fms2014
    username: root
    password: "YlI1SG91SnB3UElCRjlaeG5xcndIQT09"
    hikari:
      maximum-pool-size: 30
      pool-name: "Hikari Connection Pool"  # Pool Name Alias
      minimum-idle: 10
      idle-timeout: 10000
      connection-timeout: 3000
      auto-commit: false
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  thymeleaf:
    prefix: "classpath:/templates/"
    suffix: .html
    view-names: thymeleaf/*
    cache: false
  mvc:
    view:
      prefix: "/WEB-INF/views/"
      suffix: .jsp
  messages:
    encoding: "UTF-8"
  servlet:
    encoding:
      charset: "UTF-8"
      enabled: true
      force: true
  kafka:
    # 우리가 WSL2에 띄운 카프카 브로커의 주소입니다.
    bootstrap-servers: localhost:9092

    # Consumer(리스너)를 위한 기본 설정입니다.
    consumer:
      # 컨슈머 그룹 ID 설정 (필수값)
      group-id: my-first-consumer-group
      # 제일 처음부터 메시지를 읽을지, 최신 메시지만 읽을지 결정합니다.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    # Producer(발행자)를 위한 기본 설정입니다.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  config: "classpath:configuration/log4j/log4j2.yaml"

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: "com.portfolio.backend.dto"
  mapper-locations: "classpath*:mapper/*.xml"

management:
  endpoints:
    web:
      exposure:
        include: "env,health" # env 엔드포인트를 웹으로 노출

springdoc:
  use-fqn: true
  api-docs:
    enabled: true
    path: "/spring-boot/study"
  swagger-ui:
    path: "/swagger-ui.html"
    enabled: true

jwt:
  secret: "v3rys3cr3tk3y_must_be_long_enough_for_security_standard_at_least_256_bits"
  expiration: 3600000 # 1일
